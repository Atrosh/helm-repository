{{- if .Values.enabled }}
{{- if .Values.httproutes.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "frontend-app.fullname" . }}
  labels:
{{- include "frontend-app.labels" . | nindent 4 }}
  {{- with .Values.httproutes.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.httproutes.gateway.name }}
      namespace: {{ .Values.httproutes.gateway.namespace }}
  rules:
    - matches:
{{- range .Values.httproutes.paths }}
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | quote }}
{{- end }}
{{- with .Values.httproutes.filters }}
      filters:
{{- toYaml . | nindent 8 }}
{{- end }}
      backendRefs:
        - name: {{ include "frontend-app.fullname" $ }}
          port: {{ $.Values.service.port | quote }}
      timeouts:
        request: {{ .Values.httproutes.timeout | quote }}
{{- end }}
{{- end }}
